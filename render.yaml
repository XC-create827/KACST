# Render Blueprint — إدارة استقطاب الكفاءات (PostgreSQL version)
#
# Deploy with "New +" → "Blueprint". This provisions BOTH the web
# service and a managed PostgreSQL database, and wires DATABASE_URL
# between them automatically — no disk needed, because all data
# (including résumé files) lives in Postgres.

databases:
  - name: talent-acquisition-db
    databaseName: talent_acquisition
    user: talent_admin
    plan: basic-256mb        # free tier expires after 30 days

services:
  - type: web
    name: talent-acquisition-department
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: talent-acquisition-db
          property: connectionString
      # Set the VALUES in Render's dashboard, not here, so credentials
      # are never committed to source control.
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
